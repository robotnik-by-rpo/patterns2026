openapi: 3.0.3
info:
  title: Recipe API
  description: API для управления доменами (storage_manager) и генерации отчётов
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

tags:
  - name: domain
    description: Операции с доменами / хранилищем
  - name: extensions
    description: Формирование отчётов

paths:
  /api/domain/storage_manager:
    get:
      tags: [domain]
      summary: Получить все домены из storage_manager
      operationId: getStorageManager
      responses:
        '200':
          description: Успешный ответ со списком доменов
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/domain/{domain_id}:
    get:
      tags: [domain]
      summary: Получить домен по идентификатору
      operationId: getDomain
      parameters:
        - $ref: '#/components/parameters/DomainId'
      responses:
        '200':
          description: Найденный домен
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Домен не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

    put:
      tags: [domain]
      summary: Полностью обновить домен (PUT)
      operationId: putDomain
      parameters:
        - $ref: '#/components/parameters/DomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Обновлённый домен
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Некорректные аргументы / операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Домен не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

    patch:
      tags: [domain]
      summary: Частично обновить домен (PATCH)
      operationId: patchDomain
      parameters:
        - $ref: '#/components/parameters/DomainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Обновлённый домен
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Некорректные аргументы / операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Домен не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

    delete:
      tags: [domain]
      summary: Удалить домен
      operationId: deleteDomain
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Принудительное удаление
      responses:
        '204':
          description: Удалено успешно (без тела ответа)
        '400':
          description: Некорректные аргументы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Домен не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '409':
          description: Конфликт (операция невозможна)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/domain:
    post:
      tags: [domain]
      summary: Создать новый домен
      operationId: postDomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Домен создан
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Некорректные аргументы / операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/domain/filter/{domain_type}:
    post:
      tags: [domain]
      summary: Фильтрация доменных сущностей
      description: |
        Фильтрует объекты указанного типа домена по набору условий.
        Поддерживаются операторы EQUALS и LIKE, в том числе вложенные поля
        (например, base_unit.name).
      operationId: filterDomain
      parameters:
        - $ref: '#/components/parameters/DomainType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterDto'
            examples:
              by_name_like:
                summary: LIKE по имени
                value:
                  filters:
                    - field_name: name
                      filter_type: LIKE
                      value: flour
              nested_equals:
                summary: EQUALS по вложенному полю
                value:
                  filters:
                    - field_name: base_unit.name
                      filter_type: EQUALS
                      value: kilogram
      responses:
        '200':
          description: Список отфильтрованных объектов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          description: Неизвестный тип домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/domain/osv/{domain_type}:
    post:
      tags: [domain]
      summary: Оборотно-сальдовая ведомость (ОСВ) по типу домена
      description: |
        Формирует ОСВ по объектам указанного типа домена.
        Опционально применяется тот же фильтр, что и в /filter/{domain_type}.
        Для каждой записи возвращаются opening_balance, income, expense, closing_balance.
      operationId: postOsv
      parameters:
        - $ref: '#/components/parameters/DomainType'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterDto'
            examples:
              with_filter:
                summary: ОСВ с фильтром по имени
                value:
                  filters:
                    - field_name: name
                      filter_type: LIKE
                      value: flour
              without_filter:
                summary: ОСВ по всем объектам типа
                value: {}
      responses:
        '200':
          description: Строки оборотно-сальдовой ведомости
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OsvReportItem'
        '400':
          description: Неизвестный тип домена или ошибка обработки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/exstensions/get:
    get:
      tags: [extensions]
      summary: Получить список доступных форматов отчётов
      operationId: getExtensions
      responses:
        '200':
          description: Список расширений
          content:
            application/json:
              schema:
                type: object
                properties:
                  extensions:
                    type: array
                    items:
                      type: string
        '400':
          description: Некорректные аргументы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/exstensions/get_report:
    get:
      tags: [extensions]
      summary: Сформировать отчёт в указанном формате
      operationId: getReport
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: TXT
          description: Формат отчёта (TXT, CSV, JSON, MARKDOWN, RTF, XLSX, DOCX, PDF ...)
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            default: recipe
          description: Тип сущности
        - name: code
          in: query
          required: false
          schema:
            type: string
            default: ''
          description: Код/идентификатор сущности
      responses:
        '200':
          description: Отчёт (текстовый или бинарный в зависимости от формата)
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректные аргументы / сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

  /api/exstensions/get_default_report:
    get:
      tags: [extensions]
      summary: Сформировать отчёт в формате по умолчанию (из settings.json)
      operationId: getDefaultReport
      parameters:
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            default: recipe
        - name: code
          in: query
          required: false
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Отчёт в формате по умолчанию
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректные аргументы / сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'

components:
  parameters:
    DomainId:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор домена

    DomainType:
      name: domain_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - nomenclature_model
          - group_nomenclature_model
          - unit_of_measurement_model
          - technical_map_model
          - transaction_model
      description: |
        Тип доменной сущности:
        - nomenclature_model
        - group_nomenclature_model
        - unit_of_measurement_model
        - technical_map_model
        - transaction_model

  schemas:
    HTTPError:
      type: object
      properties:
        detail:
          type: string
          description: Описание ошибки
      example:
        detail: "Not found"

    FilterItemDto:
      type: object
      required:
        - field_name
        - filter_type
        - value
      properties:
        field_name:
          type: string
          description: Имя поля или путь с точками (например, base_unit.name)
          example: name
        filter_type:
          type: string
          enum: [EQUALS, LIKE]
          description: Тип сравнения
          example: LIKE
        value:
          type: string
          description: Значение для сравнения
          example: flour

    FilterDto:
      type: object
      properties:
        filters:
          type: array
          description: Список условий фильтрации (логика AND)
          items:
            $ref: '#/components/schemas/FilterItemDto'
          default: []
      example:
        filters:
          - field_name: name
            filter_type: LIKE
            value: flour

    OsvReportItem:
      type: object
      required:
        - id
        - name
        - opening_balance
        - income
        - expense
        - closing_balance
      properties:
        id:
          type: string
          description: Идентификатор объекта
        name:
          type: string
          description: Наименование объекта
        opening_balance:
          type: number
          description: Остаток на начало
        income:
          type: number
          description: Приход
        expense:
          type: number
          description: Расход
        closing_balance:
          type: number
          description: Остаток на конец (opening_balance + income - expense)
      example:
        id: "7f0895eb950e435fba5822e17bca024a"
        name: flour
        opening_balance: 42
        income: 84
        expense: 26
        closing_balance: 100